<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>个人库存记录</title>
<style>
/* ---------- 自托管字体 (Poppins, latin 子集, OFL) ---------- */
@font-face{font-family:'Poppins';font-style:normal;font-weight:400;font-display:swap;src:url('/static/fonts/poppins-400.woff2') format('woff2');}
@font-face{font-family:'Poppins';font-style:normal;font-weight:500;font-display:swap;src:url('/static/fonts/poppins-500.woff2') format('woff2');}
@font-face{font-family:'Poppins';font-style:normal;font-weight:600;font-display:swap;src:url('/static/fonts/poppins-600.woff2') format('woff2');}
@font-face{font-family:'Poppins';font-style:normal;font-weight:700;font-display:swap;src:url('/static/fonts/poppins-700.woff2') format('woff2');}

:root{
  --bg:#f5f7f6; --card:#ffffff; --card2:#f7f9f8; --line:#e8ecea;
  --txt:#1f2937; --muted:#8b95a1;
  --accent:#22c55e; --accent-dark:#16a34a; --accent-soft:#e9f9f0;
  --danger:#ef4444; --danger-soft:#fdecec; --warn:#f59e0b; --warn-soft:#fdf4e3;
  --r:20px; --sh:0 1px 2px rgba(16,24,40,.04), 0 8px 22px rgba(16,24,40,.05);
  --sb-h:58px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{color:var(--txt);background:var(--bg);
  font-family:'Poppins',-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","HarmonyOS Sans SC","MiSans","Noto Sans SC","Microsoft YaHei",sans-serif;
  min-height:100%;padding:0 0 150px;-webkit-font-smoothing:antialiased}
.max{max-width:760px;margin:0 auto;padding:0 16px}

/* ---------- 图标 ---------- */
.icn{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:30;padding:calc(16px + env(safe-area-inset-top)) 0 12px;
  background:linear-gradient(180deg,var(--bg) 80%, rgba(245,247,246,0))}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin:2px 4px 16px}
.hero .t h1{font-size:24px;margin:0;font-weight:600;letter-spacing:.2px;line-height:1.15}
.hero .t p{font-size:12.5px;color:var(--muted);margin:4px 0 0;font-weight:400}

.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:13px 16px;margin-bottom:14px;box-shadow:var(--sh)}
.search .s-ic{color:#b3bcc6;display:grid;place-items:center}
.search .s-ic .icn{width:18px;height:18px}
.search input{flex:1;background:none;border:none;outline:none;color:var(--txt);font:inherit;font-size:15px}
.search input::placeholder{color:#b3bcc6}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(34,197,94,.12)}

/* ---------- 汇总文字 ---------- */
.summary{display:flex;gap:18px;flex-wrap:wrap;margin:0 4px 14px;font-size:13.5px;color:var(--muted)}
.summary span{cursor:pointer;transition:.15s}
.summary b{color:var(--txt);font-weight:600;margin-left:2px}
.summary span.on{color:var(--accent-dark)}
.summary span.on b{color:var(--accent-dark)}
.summary .exp b{color:var(--danger)}
.summary .near b{color:var(--warn)}

/* ---------- 排序 ---------- */
.sortbar{display:flex;align-items:center;gap:8px;margin:0 4px 14px;overflow-x:auto;scrollbar-width:none}
.sortbar::-webkit-scrollbar{display:none}
.sortlab{font-size:12.5px;color:var(--muted);flex:0 0 auto}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:2px;flex:0 0 auto}
.seg button{border:none;background:none;font:inherit;font-size:12.5px;color:var(--muted);padding:6px 13px;
  border-radius:9px;cursor:pointer;white-space:nowrap;transition:.15s}
.seg button.on{background:var(--accent-soft);color:var(--accent-dark);font-weight:500}

/* ---------- 底部仓库栏（实底菜单栏） ---------- */
.whbar{position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);box-shadow:0 -2px 18px rgba(16,24,40,.06);
  padding:9px 0 calc(9px + env(safe-area-inset-bottom))}
.whscroll{display:flex;gap:8px;overflow-x:auto;padding:0 16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.whscroll::-webkit-scrollbar{display:none}
.whtab{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:9px 16px;border-radius:12px;
  background:var(--card2);border:1px solid transparent;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap;
  user-select:none;-webkit-user-select:none;transition:.15s}
.whtab.on{background:var(--accent);color:#fff;font-weight:500;box-shadow:0 2px 8px rgba(34,197,94,.28)}
.whtab .bd{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;padding:0 5px;
  border-radius:999px;background:#fff;color:var(--muted);font-size:11px;font-weight:500}
.whtab.on .bd{background:rgba(255,255,255,.28);color:#fff}
.whtab .bd.bad{background:var(--danger);color:#fff}
.whtab.on .bd.bad{background:#fff;color:var(--danger)}
.whtab.add{background:transparent;border:1px dashed #cfd8d4;color:var(--muted)}
.whtab.pressing{transform:scale(.95);background:var(--accent-soft);border-color:var(--accent)}
.fab{position:fixed;right:16px;bottom:calc(82px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;
  background:var(--accent);border:none;color:#fff;font-size:28px;font-weight:400;line-height:1;cursor:pointer;
  box-shadow:0 8px 24px rgba(34,197,94,.45);z-index:45;opacity:.45;transition:opacity .22s,transform .15s}
.fab:hover,.fab:focus-visible{opacity:1}
.fab:active{opacity:1;transform:scale(.92)}
.save.alt{background:var(--card2);color:var(--txt);border:1px solid var(--line);box-shadow:none}
.save.del{background:var(--danger-soft);color:var(--danger);box-shadow:none}

/* ---------- grid cards ---------- */
.sec{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 10px}
.sec h3{margin:0;font-size:13.5px;color:var(--muted);font-weight:500;letter-spacing:.2px}
.sec .n{font-size:12.5px;color:#b3bcc6}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
.gcard{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 12px 12px;box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;
  text-align:center;cursor:pointer;animation:up .32s both;transition:transform .15s,box-shadow .15s,border-color .2s}
.gcard:active{transform:scale(.975)}
.gcard.need{border-color:#f7d0d0}
.gcard.exp{border-color:#f7e3c2}
@keyframes up{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.gic{width:46px;height:46px;border-radius:14px;background:var(--accent);color:#fff;display:grid;place-items:center;margin-bottom:8px}
.gic .icn{width:24px;height:24px}
.gimg{width:100%;height:84px;border-radius:13px;overflow:hidden;margin-bottom:8px;background:var(--card2)}
.gimg img{width:100%;height:100%;object-fit:cover;display:block}
.gnm{font-size:14px;font-weight:500;line-height:1.32;width:100%;height:2.64em;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.gqty{margin-top:7px;display:flex;align-items:baseline;gap:3px;justify-content:center}
.gqty b{font-size:20px;font-weight:600;line-height:1;letter-spacing:-.4px;display:inline-block}
.gqty span{font-size:11px;color:var(--muted)}
.gdue{font-size:11px;color:#a6b0ba;margin-top:4px}
.gdue.bad{color:var(--danger)} .gdue.warn{color:var(--warn)}
.gpill{font-size:10.5px;padding:2px 9px;border-radius:999px;margin-top:5px;font-weight:500}
.gpill.danger{background:var(--danger-soft);color:var(--danger)}
.gpill.warn{background:var(--warn-soft);color:var(--warn)}
.gpill.arch{background:#eef1f4;color:var(--muted)}
.gstep{display:flex;gap:8px;margin-top:9px;width:100%}
/* 微交互：数量跳动 / 卡片脉冲 */
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.28)}70%{transform:scale(.94)}100%{transform:scale(1)}}
.gqty b.pop{animation:pop .42s cubic-bezier(.34,1.56,.64,1)}
@keyframes cardpulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.42)}100%{box-shadow:0 0 0 14px rgba(34,197,94,0)}}
.gcard.pulse{animation:cardpulse .5s ease-out}
.sbtn{height:30px;flex:1;border-radius:10px;background:var(--card2);border:1px solid var(--line);
  color:var(--txt);font-size:16px;font-weight:600;cursor:pointer;line-height:1;transition:transform .1s,background .15s}
.sbtn:hover{background:#f0f4f2}
.sbtn:active{transform:scale(.93)}
.sbtn.m{color:var(--danger)} .sbtn.p{color:var(--accent-dark)}
.trash{position:absolute;top:8px;right:8px;background:none;border:none;color:#c7ced6;cursor:pointer;padding:3px;transition:.2s}
.trash .icn{width:15px;height:15px}
.trash:active{color:var(--danger);transform:scale(1.12)}
.empty{text-align:center;color:var(--muted);padding:64px 20px}
.empty .e{font-size:46px;margin-bottom:14px}
.empty p{margin:7px 0}

/* ---------- sheets ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.32);backdrop-filter:blur(2px);z-index:50;display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:26px 26px 0 0;
  padding:20px 20px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;
  box-shadow:0 -10px 34px rgba(16,24,40,.14);animation:sl .28s both}
@keyframes sl{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.sheet h2{margin:0 0 18px;font-size:18px;font-weight:600;display:flex;align-items:center;justify-content:space-between}
.sheet h2 .x{background:var(--card2);border:1px solid var(--line);color:var(--muted);font-size:16px;padding:7px 11px;border-radius:11px;cursor:pointer}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:7px}
.field input,.field select,.field textarea{width:100%;padding:13px;border-radius:13px;border:1px solid var(--line);
  background:#fff;color:var(--txt);font:inherit;font-size:15px;outline:none}
.field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(34,197,94,.12)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.save{width:100%;padding:15px;border:none;border-radius:15px;background:var(--accent);color:#fff;font-weight:600;font-size:16px;cursor:pointer;
  box-shadow:0 8px 22px rgba(34,197,94,.28);font-family:inherit}
.check{display:flex;align-items:center;gap:9px}
.check input{width:auto}
.photo{display:flex;gap:12px;align-items:center}
.pv{width:74px;height:74px;border-radius:14px;background:var(--card2);border:1px dashed var(--line);display:grid;place-items:center;overflow:hidden;flex:0 0 auto}
.pv img{width:100%;height:100%;object-fit:cover}
.pv span{font-size:11px;color:#b3bcc6}
.pbtns{display:flex;flex-direction:column;gap:8px}
.pbtn{display:block;padding:9px 15px;border-radius:11px;background:var(--card2);border:1px solid var(--line);font-size:13px;cursor:pointer;text-align:center;color:var(--txt)}
.pbtn.rm{color:var(--danger)}
.toast{position:fixed;left:50%;bottom:calc(var(--sb-h) + 24px);transform:translateX(-50%);background:#1f2937;color:#fff;
  padding:12px 20px;border-radius:13px;font-size:13px;z-index:60;opacity:0;transition:opacity .2s;box-shadow:var(--sh)}
.toast.show{opacity:1}
a{color:var(--accent-dark)}
code{background:var(--card2);padding:1px 5px;border-radius:5px;font-size:12px}
</style>
</head>
<body>

<!-- 线性图标 sprite -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-pill" viewBox="0 0 24 24"><path d="M10.6 20.4 3.6 13.4a5 5 0 0 1 7.1-7.1l7 7a5 5 0 0 1-7.1 7.1Z"/><path d="m8.5 8.5 7 7"/></symbol>
  <symbol id="i-capsule" viewBox="0 0 24 24"><rect x="2.6" y="7.4" width="18.8" height="9.2" rx="4.6"/><path d="M12 7.4v9.2"/></symbol>
  <symbol id="i-bottle" viewBox="0 0 24 24"><path d="M9.5 2.6h5"/><path d="M10.6 2.6v3.1L8.7 8.4v11a1.6 1.6 0 0 0 1.6 1.6h3.4a1.6 1.6 0 0 0 1.6-1.6v-11l-1.9-2.7V2.6"/><path d="M8.7 13h6.6"/></symbol>
  <symbol id="i-spray" viewBox="0 0 24 24"><path d="M9 8.6h6.2V20a1 1 0 0 1-1 1H10a1 1 0 0 1-1-1z"/><path d="M10.6 8.6V5h3.1v3.6"/><path d="M16.5 4.3h3"/><path d="M16.9 7.1h2.4"/></symbol>

  <symbol id="i-cream" viewBox="0 0 24 24"><path d="M7.6 9.6h8.8v9.9a1.2 1.2 0 0 1-1.2 1.2H8.8a1.2 1.2 0 0 1-1.2-1.2z"/><path d="M9.6 9.6V6.7h4.8v2.9"/><path d="M9.6 3.3h4.8"/></symbol>
  <symbol id="i-patch" viewBox="0 0 24 24"><rect x="2.5" y="8" width="19" height="8" rx="4"/><circle cx="8.4" cy="12" r=".95"/><circle cx="12" cy="12" r=".95"/><circle cx="15.6" cy="12" r=".95"/></symbol>
  <symbol id="i-swab" viewBox="0 0 24 24"><path d="M4 20 14.4 9.6"/><path d="M13.6 4.6l5.8 5.8-2.6 2.6-5.8-5.8z"/></symbol>
  <symbol id="i-mask" viewBox="0 0 24 24"><path d="M3 9.5c3-2 15-2 18 0v3.6c0 3.2-3.4 5.9-9 5.9s-9-2.7-9-5.9z"/><path d="M8.4 10.3v6"/><path d="M15.6 10.3v6"/></symbol>
  <symbol id="i-box" viewBox="0 0 24 24"><path d="M3.3 8 12 4l8.7 4v8L12 20l-8.7-4z"/><path d="M3.3 8 12 12l8.7-4"/><path d="M12 12v8"/></symbol>
  <symbol id="i-drop" viewBox="0 0 24 24"><path d="M12 3.3s6 6.6 6 10.1a6 6 0 0 1-12 0c0-3.5 6-10.1 6-10.1z"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.3"/><path d="M15.6 15.6 20 20"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><path d="M4 7h9M17.5 7H20M4 17h2.5M11 17h9"/><circle cx="15" cy="7" r="2.3"/><circle cx="8.5" cy="17" r="2.3"/></symbol>
  <symbol id="i-tag" viewBox="0 0 24 24"><path d="M11 3.6H20v9l-8.4 8.4a1.6 1.6 0 0 1-2.3 0l-6.3-6.3a1.6 1.6 0 0 1 0-2.3z"/><circle cx="16.2" cy="7.8" r="1.3"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9.6 7V4.8h4.8V7"/><path d="M6.6 7l.9 12.2A1.4 1.4 0 0 0 8.9 20.5h6.2a1.4 1.4 0 0 0 1.4-1.3L17.4 7"/></symbol>
  <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 3.6 21 19.4H3z"/><path d="M12 9.6v4.2"/><circle cx="12" cy="16.9" r=".9"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4l10-10-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
</defs></svg>

<div class="max">
  <header>
    <div class="hero">
      <div class="t">
        <h1 id="whName">个人库存</h1>
        <p id="sub">家庭物品记录</p>
      </div>
    </div>
    <div class="search">
      <span class="s-ic"><svg class="icn"><use href="#i-search"/></svg></span>
      <input id="q" type="text" placeholder="搜索名称 / 备注…">
    </div>
    <div class="summary" id="summary"></div>
    <div class="sortbar">
      <span class="sortlab">排序</span>
      <div class="seg" id="sortField">
        <button data-f="name">名称</button>
        <button data-f="expiry">有效期</button>
      </div>
      <div class="seg" id="sortDir">
        <button data-d="1">正序</button>
        <button data-d="-1">倒序</button>
      </div>
    </div>
  </header>

  <main id="list"></main>
  <div id="empty" class="empty hidden"></div>
</div>

<!-- 底部：仓库横滑 Tab -->
<div class="whbar">
  <div class="whscroll" id="whScroll"></div>
</div>
<button class="fab" id="btnAdd" title="添加物品">＋</button>

<!-- 仓库面板（新建 / 编辑，长按 Tab 打开） -->
<div class="overlay" id="whOverlay">
  <div class="sheet">
    <h2><span id="whTitle">仓库</span><button class="x" data-close>✕</button></h2>
    <div class="field"><label>仓库名称</label><input id="wh_name" type="text" placeholder="如 药箱 / 冰箱 / 工具箱"></div>
    <button class="save" id="wh_save"><span id="wh_save_label">保存名称</span></button>
    <div id="whManageOnly" style="display:flex;flex-direction:column;gap:10px;margin-top:10px">
      <button class="save alt" id="wh_export">⬇ 导出这个仓库</button>
      <button class="save del" id="wh_del">🗑 删除这个仓库</button>
    </div>
  </div>
</div>

<div class="overlay" id="itemOverlay">
  <div class="sheet">
    <h2><span id="itemTitle">新增物品</span><button class="x" data-close>✕</button></h2>
    <div class="field"><label>名称 *</label><input id="f_name" type="text" placeholder="例如布洛芬缓释胶囊"></div>
    <div class="field"><label>分类</label><select id="f_category"></select></div>
    <div class="row2">
      <div class="field"><label>数量</label><input id="f_quantity" type="number" inputmode="decimal" value="0"></div>
      <div class="field"><label>单位</label><input id="f_unit" type="text" value="盒"></div>
    </div>
    <div class="row2">
      <div class="field"><label>预警阈值（≤ 标红）</label><input id="f_threshold" type="number" inputmode="decimal" value="0"></div>
      <div class="field"><label>有效期</label><input id="f_expiry" type="date"></div>
    </div>
    <div class="field"><label>备注</label><textarea id="f_note" rows="2"></textarea></div>
    <div class="field">
      <label>包装图 / 照片（拍药盒即可）</label>
      <div class="photo">
        <div class="pv" id="pv"><span>未设置</span></div>
        <div class="pbtns">
          <label class="pbtn" for="f_photo">📷 选择照片</label>
          <input id="f_photo" type="file" accept="image/*" style="display:none">
          <button class="pbtn rm" id="f_photo_rm" type="button">移除</button>
        </div>
      </div>
    </div>
    <div class="field check"><input type="checkbox" id="f_archived"><label for="f_archived" style="margin:0">设为已归档</label></div>
    <button class="save" id="f_save">保存</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const state={items:[],categories:[],filter:"all",cat:0,q:"",editingId:null,
  pendingPhoto:null,removePhoto:false,pulseId:null,
  sortField:(localStorage.getItem("sortField")||"name"),sortDir:Number(localStorage.getItem("sortDir")||1)};
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>Number(n).toLocaleString("zh-CN",{maximumFractionDigits:2});
const CAT_EMOJI={"家庭药箱":"💊","药箱":"💊","食品":"🍎","零食":"🍪","工具":"🧰","护肤":"🧴","化妆品":"💄","药品":"💊"};
const cemo=n=>CAT_EMOJI[n]||"📦";
function iconFor(name){
  const n=name||"";
  if(/创可贴|鼻贴|退热贴|贴膏|膏药|止痛膏|敷料|纱布/.test(n))return "patch";
  if(/棉签/.test(n))return "swab";
  if(/口罩/.test(n))return "mask";
  if(/喷雾|喷剂|喷鼻|吸入|鼻舒/.test(n))return "spray";
  if(/滴眼|滴鼻|滴耳|滴剂|滴液/.test(n))return "dropper";
  if(/软膏|乳膏|凝胶|洗剂|擦剂|油$|风油精|清凉油/.test(n))return "cream";
  if(/口服液|溶液|液$|水$|精$/.test(n))return "bottle";
  if(/胶囊/.test(n))return "capsule";
  if(/片|丸|粒|泡腾|含片|散|丹|药/.test(n))return "pill";
  return "pill";
}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),1800)}
async function api(path,opts={}){
  const r=await fetch("/api"+path,{headers:{"Content-Type":"application/json"},...opts});
  if(!r.ok){let d=r.statusText;try{const j=await r.json();if(j.detail)d=typeof j.detail==="string"?j.detail:JSON.stringify(j.detail)}catch(e){}throw new Error(d)}
  const ct=r.headers.get("Content-Type")||"";return ct.includes("json")?r.json():r.text();
}
/* ---- 仓库（分类）与 URL 路由：/w/<id> ---- */
function catFromUrl(){
  const m=location.pathname.match(/^\/w\/(\d+)/);
  return m?Number(m[1]):(state.categories[0]?state.categories[0].id:0);
}
function setUrl(id){
  const p="/w/"+id;
  if(location.pathname!==p)history.pushState({cat:id},"",p);
}
async function load(){
  state.items=await api("/items");
  state.categories=await api("/categories");
  const want=catFromUrl();
  state.cat=state.categories.some(c=>c.id===want)?want:(state.categories[0]?state.categories[0].id:0);
  render();
}
window.addEventListener("popstate",()=>{
  const want=catFromUrl();
  if(state.categories.some(c=>c.id===want)){state.cat=want;state.filter="all";render()}
});

function visible(){
  let l=[...state.items];
  if(state.cat)l=l.filter(i=>i.category_id===state.cat);
  if(state.filter==="low")l=l.filter(i=>!i.archived&&i.low_stock);
  else if(state.filter==="expired")l=l.filter(i=>!i.archived&&i.expired);
  else if(state.filter==="expiring")l=l.filter(i=>!i.archived&&i.expiring_soon);
  else if(state.filter==="alert")l=l.filter(i=>!i.archived&&(i.low_stock||i.expired||i.expiring_soon));
  else if(state.filter==="archived")l=l.filter(i=>i.archived);
  else l=l.filter(i=>!i.archived);
  if(state.q){const q=state.q.toLowerCase();l=l.filter(i=>i.name.toLowerCase().includes(q)||(i.note||"").toLowerCase().includes(q))}
  return l;
}
function render(){
  const cur=state.categories.find(c=>c.id===state.cat);
  const all=state.items.filter(i=>!state.cat||i.category_id===state.cat);
  const act=all.filter(i=>!i.archived);
  const low=act.filter(i=>i.low_stock).length,exp=act.filter(i=>i.expired).length,near=act.filter(i=>i.expiring_soon).length;
  $("#whName").textContent=cur?cur.name:"个人库存";
  $("#sub").textContent=state.categories.length?"家庭物品记录":"点底部「＋仓库」新建一个仓库";
  $("#summary").innerHTML=`
    <span class="${state.filter==='all'?'on':''}" data-f="all">总数量<b>${act.length}</b></span>
    <span class="exp ${state.filter==='expired'?'on':''}" data-f="expired">过期数量<b>${exp}</b></span>
    <span class="near ${state.filter==='expiring'?'on':''}" data-f="expiring">临期数量<b>${near}</b></span>`;
  $$("#summary span").forEach(s=>s.onclick=()=>{state.filter=s.dataset.f;render()});
  renderWhTabs();
  renderSort();
  const lv=sortList(visible());const empty=$("#empty");
  if(!lv.length){empty.classList.remove("hidden");empty.innerHTML=`<div class="e">📭</div><p>没有符合条件的物品</p><p style="font-size:12.5px;color:var(--muted)">点右下角 ＋ 添加，或换个筛选条件</p>`;$("#list").innerHTML="";return}
  empty.classList.add("hidden");let html=`<div class="grid">`;
  lv.forEach((i,idx)=>{
      const need=i.low_stock,expired=i.expired||i.expiring_soon;
      let tag='';
      if(i.archived)tag=`<div class="gpill arch">已归档</div>`;
      else if(i.expired)tag=`<div class="gpill danger">已过期</div>`;
      else if(i.expiring_soon)tag=`<div class="gpill warn">将过期</div>`;
      else if(i.low_stock)tag=`<div class="gpill danger">需补充</div>`;
      const due=i.expiry_date
        ? `<div class="gdue ${i.expired?'bad':(i.expiring_soon?'warn':'')}">有效期 ${esc(i.expiry_date)}</div>`
        : `<div class="gdue">无有效期</div>`;
      html+=`<div class="gcard ${need?'need':''} ${expired?'exp':''} ${i.id===state.pulseId?'pulse':''}" data-id="${i.id}"
          title="${esc(i.name)}${i.note?' · '+esc(i.note):''}"
          style="animation-delay:${Math.min(idx*14,200)}ms">
        <button class="trash" data-del="${i.id}"><svg class="icn"><use href="#i-trash"/></svg></button>
        ${i.image
          ? `<div class="gimg"><img src="${esc(i.image)}" alt="" loading="lazy"></div>`
          : `<div class="gic"><svg class="icn"><use href="#i-${iconFor(i.name)}"/></svg></div>`}
        <div class="gnm">${esc(i.name)}</div>
        <div class="gqty"><b class="${i.id===state.pulseId?'pop':''}" style="color:${i.low_stock?'var(--danger)':'var(--txt)'}">${fmt(i.quantity)}</b><span>${esc(i.unit)}</span></div>
        ${due}${tag}
        <div class="gstep">
          <button class="sbtn m" data-q="-1" data-id="${i.id}">−</button>
          <button class="sbtn p" data-q="1" data-id="${i.id}">＋</button>
        </div>
      </div>`;
  });
  html+=`</div>`;
  $("#list").innerHTML=html;
  $$(".gcard[data-id]").forEach(el=>el.onclick=()=>openItem(Number(el.dataset.id)));
  $$(".sbtn").forEach(b=>b.onclick=async e=>{e.stopPropagation();const id=Number(b.dataset.id);const d=Number(b.dataset.q);await change(id,d)});
  $$(".trash").forEach(b=>b.onclick=async e=>{e.stopPropagation();if(confirm("删除该物品？")){try{await api(`/items/${b.dataset.del}`,{method:"DELETE"});await load();toast("已删除")}catch(err){toast(err.message)}}});
  if(state.pulseId){const pid=state.pulseId;setTimeout(()=>{if(state.pulseId===pid)state.pulseId=null},620)}
}
async function change(id,delta){
  state.pulseId=id;
  try{await api(`/items/${id}/quantity`,{method:"POST",body:JSON.stringify({delta})});await load()}
  catch(e){state.pulseId=null;toast("修改失败: "+e.message)}
}

/* ---- 照片：前端压缩后上传 ---- */
function shrink(file,max=720,q=.85){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file);const img=new Image();
    img.onload=()=>{
      const s=Math.min(1,max/Math.max(img.width,img.height));
      const w=Math.round(img.width*s),h=Math.round(img.height*s);
      const c=document.createElement("canvas");c.width=w;c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);URL.revokeObjectURL(url);
      c.toBlob(b=>b?resolve(b):reject(new Error("压缩失败")),"image/jpeg",q);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error("无法读取图片"))};
    img.src=url;
  });
}
async function uploadPhoto(id,blob){
  const fd=new FormData();fd.append("file",blob,"photo.jpg");
  const r=await fetch(`/api/items/${id}/image`,{method:"POST",body:fd});
  if(!r.ok){let d="上传失败";try{const j=await r.json();if(j.detail)d=j.detail}catch(e){};throw new Error(d)}
  return r.json();
}
function setPhotoPreview(url){$("#pv").innerHTML=url?`<img src="${esc(url)}" alt="">`:`<span>未设置</span>`}

function fillCat(sel){const s=$("#f_category");s.innerHTML=`<option value="">未分类</option>`+state.categories.map(c=>`<option value="${c.id}" ${c.id===sel?"selected":""}>${esc(c.name)}</option>`).join("")}
function openItem(id){state.editingId=id||null;state.pendingPhoto=null;state.removePhoto=false;
  $("#itemTitle").textContent=id?"编辑物品":"新增物品";fillCat();
  if(id){const i=state.items.find(x=>x.id===id);$("#f_name").value=i.name;$("#f_quantity").value=i.quantity;$("#f_unit").value=i.unit;
    $("#f_threshold").value=i.threshold;$("#f_expiry").value=i.expiry_date||"";$("#f_note").value=i.note||"";$("#f_archived").checked=!!i.archived;$("#f_category").value=i.category_id!=null?i.category_id:"";
    setPhotoPreview(i.image||null)}
  else{$("#f_name").value="";$("#f_quantity").value=0;$("#f_unit").value="盒";$("#f_threshold").value=0;$("#f_expiry").value="";$("#f_note").value="";$("#f_archived").checked=false;
    setPhotoPreview(null)}
  $("#itemOverlay").classList.add("show")}
async function saveItem(){const b={name:$("#f_name").value.trim(),category_id:$("#f_category").value?Number($("#f_category").value):null,
  quantity:Number($("#f_quantity").value||0),unit:$("#f_unit").value.trim()||"个",threshold:Number($("#f_threshold").value||0),
  expiry_date:$("#f_expiry").value||null,note:$("#f_note").value.trim()||null,archived:$("#f_archived").checked};
  if(!b.name){toast("名称不能为空");return}
  try{
    let id=state.editingId;
    if(id){await api(`/items/${id}`,{method:"PUT",body:JSON.stringify(b)})}
    else{const created=await api("/items",{method:"POST",body:JSON.stringify(b)});id=created.id}
    if(state.pendingPhoto){await uploadPhoto(id,state.pendingPhoto)}
    else if(state.removePhoto&&state.editingId){await api(`/items/${id}/image`,{method:"DELETE"})}
    $("#itemOverlay").classList.remove("show");await load();toast(state.editingId?"已更新":"已添加")
  }catch(e){toast("保存失败: "+e.message)}}

/* ---- 底部仓库 Tab 条 ---- */
function renderWhTabs(){
  const box=$("#whScroll");
  const tabs=state.categories.map(c=>{
    const its=state.items.filter(i=>i.category_id===c.id&&!i.archived);
    const bad=its.filter(i=>i.expired||i.expiring_soon).length;
    return `<div class="whtab ${state.cat===c.id?'on':''}" data-c="${c.id}">
      ${esc(c.name)}<span class="bd ${bad?'bad':''}">${bad?bad:its.length}</span></div>`;
  }).join("");
  box.innerHTML=tabs+`<div class="whtab add" id="whAddTab">＋ 仓库</div>`;
  box.querySelectorAll(".whtab[data-c]").forEach(el=>{
    const id=Number(el.dataset.c);
    let timer=null,longPressed=false;
    const start=()=>{longPressed=false;el.classList.add("pressing");
      timer=setTimeout(()=>{longPressed=true;el.classList.remove("pressing");openWhPanel(id)},520)};
    const cancel=()=>{clearTimeout(timer);el.classList.remove("pressing")};
    el.addEventListener("touchstart",start,{passive:true});
    el.addEventListener("touchend",cancel);el.addEventListener("touchcancel",cancel);
    el.addEventListener("touchmove",cancel);
    el.addEventListener("mousedown",start);el.addEventListener("mouseup",cancel);el.addEventListener("mouseleave",cancel);
    el.addEventListener("click",e=>{
      if(longPressed){e.preventDefault();return}
      cancel();
      if(state.cat!==id){state.cat=id;state.filter="all";setUrl(id);render()}
      else{box.scrollIntoView&&0}
    });
    el.addEventListener("contextmenu",e=>{e.preventDefault();openWhPanel(id)});
  });
  const add=document.getElementById("whAddTab");
  if(add)add.onclick=()=>openWhCreate();
  const act=box.querySelector(".whtab.on");
  if(act&&act.scrollIntoView)act.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"});
}

/* ---- 仓库面板：新建 / 编辑 ---- */
let whPanelId=null, whMode="edit";
function openWhPanel(id){
  const c=state.categories.find(x=>x.id===id);if(!c)return;
  whMode="edit";whPanelId=id;
  $("#whTitle").textContent=c.name;
  $("#wh_name").value=c.name;
  $("#wh_save_label").textContent="保存名称";
  $("#whManageOnly").style.display="flex";
  $("#whOverlay").classList.add("show");
  setTimeout(()=>$("#wh_name").select(),160);
}
function openWhCreate(){
  whMode="create";whPanelId=null;
  $("#whTitle").textContent="新建仓库";
  $("#wh_name").value="";
  $("#wh_save_label").textContent="创建仓库";
  $("#whManageOnly").style.display="none";
  $("#whOverlay").classList.add("show");
  setTimeout(()=>$("#wh_name").focus(),160);
}

/* ---- 排序：名称 / 有效期 × 正序 / 倒序 ---- */
function sortList(l){
  const zhCmp=(a,b)=>a.name.localeCompare(b.name,"zh");
  if(state.sortField==="expiry"){
    const has=l.filter(i=>i.expiry_date).sort((a,b)=>(
      a.expiry_date<b.expiry_date?-1:a.expiry_date>b.expiry_date?1:0)||zhCmp(a,b));
    const none=l.filter(i=>!i.expiry_date).sort(zhCmp);   // 无有效期永远排最后
    if(state.sortDir<0)has.reverse();
    return [...has,...none];
  }
  const out=[...l].sort(zhCmp);
  if(state.sortDir<0)out.reverse();
  return out;
}
function renderSort(){
  $$("#sortField button").forEach(b=>b.classList.toggle("on",b.dataset.f===state.sortField));
  $$("#sortDir button").forEach(b=>b.classList.toggle("on",Number(b.dataset.d)===state.sortDir));
}
$$("#sortField button").forEach(b=>b.onclick=()=>{
  state.sortField=b.dataset.f;localStorage.setItem("sortField",state.sortField);render();
});
$$("#sortDir button").forEach(b=>b.onclick=()=>{
  state.sortDir=Number(b.dataset.d);localStorage.setItem("sortDir",state.sortDir);render();
});

$("#btnAdd").onclick=()=>openItem(null);
$("#f_save").onclick=saveItem;
$("#f_photo").addEventListener("change",async e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  try{const blob=await shrink(f,720,.85);state.pendingPhoto=blob;state.removePhoto=false;setPhotoPreview(URL.createObjectURL(blob))}
  catch(err){toast("图片处理失败: "+err.message)}
  e.target.value="";
});
$("#f_photo_rm").onclick=()=>{state.pendingPhoto=null;state.removePhoto=true;setPhotoPreview(null)};

$("#wh_save").onclick=async()=>{
  const n=$("#wh_name").value.trim();
  if(!n){toast("名称不能为空");$("#wh_name").focus();return}
  try{
    if(whMode==="create"){
      const c=await api("/categories",{method:"POST",body:JSON.stringify({name:n})});
      $("#whOverlay").classList.remove("show");
      await load();
      state.cat=c.id;state.filter="all";setUrl(c.id);render();
      toast("已新建："+c.name);
    }else{
      await api(`/categories/${whPanelId}`,{method:"PATCH",body:JSON.stringify({name:n,sort_order:0})});
      $("#whOverlay").classList.remove("show");await load();toast("已重命名");
    }
  }catch(e){toast((whMode==="create"?"创建失败: ":"重命名失败: ")+e.message)}
};
$("#wh_name").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();$("#wh_save").click()}});
$("#wh_export").onclick=()=>{window.open(`/api/export?category_id=${whPanelId}`,"_blank")};
$("#wh_del").onclick=async()=>{
  const c=state.categories.find(x=>x.id===whPanelId);
  if(!confirm(`删除仓库「${c?c.name:""}」？\n里面的物品会变成「未分类」，不会丢失。`))return;
  try{
    await api(`/categories/${whPanelId}`,{method:"DELETE"});
    $("#whOverlay").classList.remove("show");
    await load();
    if(state.categories[0]){state.cat=state.categories[0].id;setUrl(state.cat)}
    state.filter="all";render();toast("已删除");
  }catch(e){toast("删除失败: "+e.message)}
};

$$(".overlay").forEach(o=>o.addEventListener("click",e=>{if(e.target===o)o.classList.remove("show")}));
$$("[data-close]").forEach(b=>b.onclick=()=>b.closest(".overlay").classList.remove("show"));
$("#q").addEventListener("input",e=>{state.q=e.target.value.trim();render()});
load();
</script>

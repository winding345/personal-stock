<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>个人库存记录</title>
<style>
:root{
  --bg:#f4f6f8; --card:#ffffff; --card2:#fafbfc; --line:#e9edf1;
  --txt:#1f2937; --muted:#8a93a3;
  --accent:#4f46e5; --accent-soft:#eef0fe;
  --danger:#ef4444; --danger-soft:#fdecec; --warn:#f59e0b; --warn-soft:#fdf3e2; --ok:#10b981; --ok-soft:#e7f7f1;
  --r:16px; --sh:0 1px 2px rgba(16,24,40,.05), 0 6px 16px rgba(16,24,40,.06);
  --sb-h:56px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{color:var(--txt);background:var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  min-height:100%;padding:0 0 calc(var(--sb-h) + 100px);}
.max{max-width:720px;margin:0 auto;padding:0 14px}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:30;padding:calc(14px + env(safe-area-inset-top)) 0 10px;
  background:linear-gradient(180deg,var(--bg) 78%, rgba(244,246,248,0));}
.hero{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 2px 12px;}
.hero .logo{width:44px;height:44px;border-radius:14px;background:var(--accent);display:grid;place-items:center;font-size:22px;box-shadow:0 6px 14px rgba(79,70,229,.28)}
.hero .t h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.3px}
.hero .t p{font-size:12px;color:var(--muted);margin:2px 0 0}
.hero .set{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px;font-size:16px;cursor:pointer;box-shadow:var(--sh)}

.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:11px 14px;margin-bottom:12px;box-shadow:var(--sh);}
.search .ic{opacity:.55;font-size:15px}
.search input{flex:1;background:none;border:none;outline:none;color:var(--txt);font:inherit;font-size:15px}
.search input::placeholder{color:var(--muted)}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,70,229,.12)}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px;}
.s{border:1px solid var(--line);border-radius:16px;padding:12px 6px;text-align:center;cursor:pointer;background:var(--card);box-shadow:var(--sh);transition:.15s}
.s .b{font-size:21px;font-weight:800;line-height:1.1}
.s .l{font-size:11px;color:var(--muted);margin-top:4px}
.s .d{width:7px;height:7px;border-radius:50%;margin:3px auto 0}
.s.low .b{color:var(--danger)} .s.low .d{background:var(--danger)}
.s.exp .b{color:var(--warn)} .s.exp .d{background:var(--warn)}
.s.near .b{color:var(--ok)} .s.near .d{background:var(--ok)}
.s.ring{background:var(--accent-soft);border-color:#dcdffd}
.s.ring .b{color:var(--accent)} .s.ring .l{color:var(--accent)}
.s.on{outline:2px solid var(--accent);outline-offset:-2px}

/* ---------- category chips ---------- */
.cats{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.cats::-webkit-scrollbar{display:none}
.catc{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;font-size:13px;color:var(--muted);
  background:var(--card);border:1px solid var(--line);cursor:pointer;white-space:nowrap;transition:.15s;box-shadow:var(--sh)}
.catc .em{font-size:15px}
.catc.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}

/* ---------- grid cards ---------- */
main{padding:0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:4px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.gcard{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:15px 12px 11px;box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;
  text-align:center;cursor:pointer;animation:up .3s both;overflow:hidden;transition:.15s}
.gcard:active{transform:scale(.98)}
.gcard.need{border-color:#f6c9c9;background:linear-gradient(180deg,#fffafa,#fff)}
.gcard.exp{border-color:#f6e0bb;background:linear-gradient(180deg,#fffcf5,#fff)}
.gic{width:48px;height:48px;border-radius:15px;background:var(--accent-soft);display:grid;place-items:center;font-size:25px;margin-bottom:9px}
.gnm{font-size:14px;font-weight:600;line-height:1.32;width:100%;height:2.64em;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.gqty{margin-top:7px;display:flex;align-items:baseline;gap:3px;justify-content:center}
.gqty b{font-size:21px;font-weight:800;line-height:1}
.gqty span{font-size:11px;color:var(--muted)}
.gdue{font-size:11px;color:var(--muted);margin-top:4px}
.gdue.bad{color:var(--danger)} .gdue.warn{color:var(--warn)}
.gpill{font-size:10px;padding:1px 8px;border-radius:999px;margin-top:5px;font-weight:600}
.gpill.low{background:var(--danger-soft);color:var(--danger)}
.gpill.warn{background:var(--warn-soft);color:var(--warn)}
.gstep{display:flex;gap:8px;margin-top:9px;width:100%}
.gstep .sbtn{flex:1;height:30px}
.gcard .trash{top:7px;right:7px;font-size:13px}
.sec{display:flex;align-items:center;justify-content:space-between;margin:16px 2px 8px}
.sec h3{margin:0;font-size:13px;color:var(--muted);font-weight:600}
.sec .n{font-size:12px;color:var(--muted)}
.card{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:13px 12px;margin-bottom:10px;box-shadow:var(--sh);
  animation:up .3s both;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent}
.card.need::before{background:var(--danger)}
.card.exp::before{background:var(--warn)}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;flex:0 0 auto;background:var(--accent-soft)}
.info{flex:1;min-width:0}
.info .nm{font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.info .meta{margin-top:5px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:600}
.pill.low{background:var(--danger-soft);color:var(--danger)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.arch{background:#eef1f4;color:var(--muted)}
.info .due{margin-top:5px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px}
.info .due.bad{color:var(--danger)} .info .due.warn{color:var(--warn)}
.qty{text-align:center;flex:0 0 auto}
.qty .v{font-size:22px;font-weight:800;line-height:1}
.qty .u{font-size:11px;color:var(--muted);margin-top:2px}
.step{display:flex;gap:6px;margin-top:7px}
.sbtn{width:34px;height:30px;border-radius:9px;background:var(--card2);border:1px solid var(--line);
  color:var(--txt);font-size:16px;font-weight:700;cursor:pointer;line-height:1;transition:.1s}
.sbtn:active{transform:scale(.9)}
.sbtn.m{color:var(--danger)} .sbtn.p{color:var(--ok)}
.trash{position:absolute;top:10px;right:10px;background:none;border:none;color:var(--muted);font-size:14px;cursor:pointer;opacity:.5;transition:.2s}
.trash:active{opacity:1;transform:scale(1.2)}
.empty{text-align:center;color:var(--muted);padding:56px 20px}
.empty .e{font-size:44px;margin-bottom:12px}
.empty p{margin:6px 0}

/* ---------- bottom nav + fab ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:8px 14px calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(244,246,248,0), var(--bg) 40%);display:flex;justify-content:center;}
.navin{width:100%;max-width:520px;display:grid;grid-template-columns:1fr 64px 1fr;align-items:center;gap:8px;
  background:var(--card);border:1px solid var(--line);border-radius:22px;padding:8px 10px;box-shadow:var(--sh)}
.nbtn{background:none;border:none;color:var(--muted);font-size:12px;padding:5px;border-radius:12px;cursor:pointer;transition:.15s}
.nbtn .em{display:block;font-size:18px;margin-bottom:2px}
.nbtn.on{color:var(--accent)}
.fab{width:52px;height:52px;border-radius:50%;background:var(--accent);border:none;color:#fff;font-size:26px;font-weight:700;
  cursor:pointer;box-shadow:0 10px 24px rgba(79,70,229,.4);margin:0 auto;transition:.15s}
.fab:active{transform:scale(.92)}

/* ---------- sheets ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.32);backdrop-filter:blur(2px);z-index:50;display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;
  padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;box-shadow:0 -10px 30px rgba(16,24,40,.15);animation:sl .28s both}
@keyframes sl{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.sheet h2{margin:0 0 16px;font-size:18px;display:flex;align-items:center;justify-content:space-between}
.sheet h2 .x{background:var(--card2);border:1px solid var(--line);color:var(--muted);font-size:16px;padding:6px 10px;border-radius:10px}
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);
  background:#fff;color:var(--txt);font:inherit;font-size:15px;outline:none}
.field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,70,229,.12)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.save{width:100%;padding:14px;border:none;border-radius:14px;background:var(--accent);color:#fff;font-weight:700;font-size:16px;cursor:pointer;box-shadow:0 10px 24px rgba(79,70,229,.28)}
.check{display:flex;align-items:center;gap:8px}
.check input{width:auto}
.toast{position:fixed;left:50%;bottom:calc(var(--sb-h) + 22px);transform:translateX(-50%);background:#1f2937;
  color:#fff;padding:11px 18px;border-radius:12px;font-size:13px;z-index:60;opacity:0;transition:opacity .2s;box-shadow:var(--sh)}
.toast.show{opacity:1}
a{color:var(--accent)}
</style>
</head>
<body>
<div class="max">

  <header>
    <div class="hero">
      <div class="logo">💊</div>
      <div class="t">
        <h1>个人库存</h1>
        <p id="sub">药箱 · 家庭物品记录</p>
      </div>
      <button class="set" id="btnInfo">⚙️</button>
    </div>
    <div class="search"><span class="ic">🔍</span><input id="q" type="text" placeholder="搜索名称 / 备注…"></div>
    <div class="stats" id="stats"></div>
    <div class="cats" id="cats"></div>
  </header>

  <main id="list"></main>
  <div id="empty" class="empty hidden"></div>
</div>

<!-- 底部导航 + FAB -->
<div class="nav">
  <div class="navin">
    <button class="nbtn on" data-nav="list"><span class="em">📦</span>库存</button>
    <button class="fab" id="btnAdd">＋</button>
    <button class="nbtn" data-nav="cat"><span class="em">🏷️</span>分类</button>
  </div>
</div>

<!-- 编辑/新增 -->
<div class="overlay" id="itemOverlay">
  <div class="sheet">
    <h2><span id="itemTitle">新增物品</span><button class="x" data-close>✕</button></h2>
    <div class="field"><label>名称 *</label><input id="f_name" type="text" placeholder="例如布洛芬缓释胶囊"></div>
    <div class="field"><label>分类</label><select id="f_category"></select></div>
    <div class="row2">
      <div class="field"><label>数量</label><input id="f_quantity" type="number" inputmode="decimal" value="0"></div>
      <div class="field"><label>单位</label><input id="f_unit" type="text" value="盒"></div>
    </div>
    <div class="row2">
      <div class="field"><label>预警阈值（≤ 标红）</label><input id="f_threshold" type="number" inputmode="decimal" value="0"></div>
      <div class="field"><label>有效期</label><input id="f_expiry" type="date"></div>
    </div>
    <div class="field"><label>备注</label><textarea id="f_note" rows="2"></textarea></div>
    <div class="field check"><input type="checkbox" id="f_archived"><label for="f_archived" style="margin:0">设为已归档</label></div>
    <button class="save" id="f_save">保存</button>
  </div>
</div>

<!-- 分类 -->
<div class="overlay" id="catOverlay">
  <div class="sheet">
    <h2><span>分类管理</span><button class="x" data-close>✕</button></h2>
    <div class="field" style="display:flex;gap:8px">
      <input id="cat_new" type="text" placeholder="新分类名">
      <button class="save" style="width:auto;padding:0 18px" id="cat_add">添加</button>
    </div>
    <div id="cat_list"></div>
  </div>
</div>

<!-- 设置/关于 -->
<div class="overlay" id="infoOverlay">
  <div class="sheet">
    <h2><span>设置 / 备份</span><button class="x" data-close>✕</button></h2>
    <div style="display:flex;flex-direction:column;gap:10px">
      <button class="save" id="btnExport">⬇️ 导出 JSON 备份</button>
      <p style="font-size:12px;color:var(--muted);margin:4px 0">数据存于本地 SQLite 文件（<code>./data/stock.db</code>）。导出可作备份，删除前请先导出。</p>
      <p style="font-size:12px;color:var(--muted);margin:0">图标分类示意：💊 药箱、🍎 食品、🧰 工具…按分类名自动匹配。</p>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const state={items:[],categories:[],filter:"all",cat:0,q:"",editingId:null};
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>Number(n).toLocaleString("zh-CN",{maximumFractionDigits:2});
const CAT_EMOJI={"家庭药箱":"💊","药箱":"💊","食品":"🍎","零食":"🍪","工具":"🧰","护肤":"🧴","化妆品":"💄","药品":"💊"};
const cemo=n=>CAT_EMOJI[n]||"📦";
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),1800)}
async function api(path,opts={}){
  const r=await fetch("/api"+path,{headers:{"Content-Type":"application/json"},...opts});
  if(!r.ok){let d=r.statusText;try{const j=await r.json();if(j.detail)d=typeof j.detail==="string"?j.detail:JSON.stringify(j.detail)}catch(e){}throw new Error(d)}
  const ct=r.headers.get("Content-Type")||"";return ct.includes("json")?r.json():r.text();
}
async function load(){state.items=await api("/items");state.categories=await api("/categories");render()}

function visible(){
  let l=[...state.items];
  if(state.cat)l=l.filter(i=>i.category_id===state.cat);
  if(state.filter==="low")l=l.filter(i=>!i.archived&&i.low_stock);
  else if(state.filter==="expired")l=l.filter(i=>!i.archived&&i.expired);
  else if(state.filter==="expiring")l=l.filter(i=>!i.archived&&i.expiring_soon);
  else if(state.filter==="archived")l=l.filter(i=>i.archived);
  else l=l.filter(i=>!i.archived);
  if(state.q){const q=state.q.toLowerCase();l=l.filter(i=>i.name.toLowerCase().includes(q)||(i.note||"").toLowerCase().includes(q))}
  return l;
}
function render(){
  const all=state.items; const act=all.filter(i=>!i.archived);
  const low=act.filter(i=>i.low_stock).length,exp=act.filter(i=>i.expired).length,near=act.filter(i=>i.expiring_soon).length;
  const pct=act.length?Math.round((act.length-exp-low)*100/act.length):0;
  $("#stats").innerHTML=`
    <div class="s ring ${state.filter==='all'?'on':''}" data-f="all"><div class="b">${fmt(pct)}%</div><div class="l">健康度</div></div>
    <div class="s low ${state.filter==='low'?'on':''}" data-f="low"><div class="b">${low}</div><div class="l">需补充</div><div class="d"></div></div>
    <div class="s exp ${state.filter==='expired'?'on':''}" data-f="expired"><div class="b">${exp}</div><div class="l">已过期</div><div class="d"></div></div>
    <div class="s near ${state.filter==='expiring'?'on':''}" data-f="expiring"><div class="b">${near}</div><div class="l">将过期</div><div class="d"></div></div>`;
  $$("#stats .s").forEach(s=>s.onclick=()=>{state.filter=s.dataset.f;render()});
  const cc=[{id:0,name:"全部",em:"🗂️"}].concat(state.categories.map(c=>({id:c.id,name:c.name,em:cemo(c.name)})));
  $("#cats").innerHTML=cc.map(c=>`<div class="catc ${state.cat===c.id?'on':''}" data-c="${c.id}"><span class="em">${c.em}</span>${esc(c.name)}</div>`).join("");
  $$("#cats .catc").forEach(el=>el.onclick=()=>{state.cat=Number(el.dataset.c);render()});
  const lv=visible();const empty=$("#empty");
  const groups={};lv.forEach(i=>{const k=i.category_name||"未分类";(groups[k]=groups[k]||[]).push(i)});
  if(!lv.length){empty.classList.remove("hidden");empty.innerHTML=`<div class="e">📭</div><p>没有符合条件的物品</p><p style="font-size:12px;color:var(--muted)">点右下角 ＋ 添加，或换个筛选条件</p>`;$("#list").innerHTML="";return}
  empty.classList.add("hidden");let html="";
  Object.keys(groups).sort((a,b)=>(a==="未分类")-(b==="未分类")||a.localeCompare(b)).forEach(k=>{
    const it=groups[k];
    html+=`<div class="sec"><h3>${cemo(k)} ${esc(k)}</h3><span class="n">${it.length}</span></div><div class="grid">`;
    it.forEach((i,idx)=>{
      const need=i.low_stock,expired=i.expired||i.expiring_soon;
      let tag='';
      if(i.archived)tag=`<div class="gpill" style="background:#eef1f4;color:var(--muted)">已归档</div>`;
      else if(i.expired)tag=`<div class="gpill warn">已过期</div>`;
      else if(i.expiring_soon)tag=`<div class="gpill warn">将过期</div>`;
      else if(i.low_stock)tag=`<div class="gpill low">需补充</div>`;
      const due=i.expiry_date
        ? `<div class="gdue ${i.expired?'bad':(i.expiring_soon?'warn':'')}">效期 ${esc(i.expiry_date)}</div>`
        : `<div class="gdue">无有效期</div>`;
      html+=`<div class="gcard ${need?'need':''} ${expired?'exp':''}" data-id="${i.id}"
          title="${esc(i.name)}${i.note?' · '+esc(i.note):''}"
          style="animation-delay:${Math.min(idx*14,200)}ms">
        <button class="trash" data-del="${i.id}">🗑</button>
        <div class="gic">${cemo(i.category_name)}</div>
        <div class="gnm">${esc(i.name)}</div>
        <div class="gqty"><b style="color:${i.low_stock?'var(--danger)':'var(--txt)'}">${fmt(i.quantity)}</b><span>${esc(i.unit)}</span></div>
        ${due}${tag}
        <div class="gstep">
          <button class="sbtn m" data-q="-1" data-id="${i.id}">−</button>
          <button class="sbtn p" data-q="1" data-id="${i.id}">＋</button>
        </div>
      </div>`;
    });
    html+=`</div>`;
  });
  $("#list").innerHTML=html;
  $$(".gcard[data-id]").forEach(el=>el.onclick=()=>openItem(Number(el.dataset.id)));
  $$(".sbtn").forEach(b=>b.onclick=async e=>{e.stopPropagation();const id=Number(b.dataset.id);const d=Number(b.dataset.q);await change(id,d)});
  $$(".trash").forEach(b=>b.onclick=async e=>{e.stopPropagation();if(confirm("删除该物品？")){try{await api(`/items/${b.dataset.del}`,{method:"DELETE"});await load();toast("已删除")}catch(err){toast(err.message)}}});
}
async function change(id,delta){try{await api(`/items/${id}/quantity`,{method:"POST",body:JSON.stringify({delta})});await load()}catch(e){toast("修改失败: "+e.message)}}

function fillCat(sel){const s=$("#f_category");s.innerHTML=`<option value="">未分类</option>`+state.categories.map(c=>`<option value="${c.id}" ${c.id===sel?"selected":""}>${esc(c.name)}</option>`).join("")}
function openItem(id){state.editingId=id||null;$("#itemTitle").textContent=id?"编辑物品":"新增物品";fillCat();
  if(id){const i=state.items.find(x=>x.id===id);$("#f_name").value=i.name;$("#f_quantity").value=i.quantity;$("#f_unit").value=i.unit;
    $("#f_threshold").value=i.threshold;$("#f_expiry").value=i.expiry_date||"";$("#f_note").value=i.note||"";$("#f_archived").checked=!!i.archived;$("#f_category").value=i.category_id!=null?i.category_id:""}
  else{$("#f_name").value="";$("#f_quantity").value=0;$("#f_unit").value="盒";$("#f_threshold").value=0;$("#f_expiry").value="";$("#f_note").value="";$("#f_archived").checked=false}
  $("#itemOverlay").classList.add("show")}
async function saveItem(){const b={name:$("#f_name").value.trim(),category_id:$("#f_category").value?Number($("#f_category").value):null,
  quantity:Number($("#f_quantity").value||0),unit:$("#f_unit").value.trim()||"个",threshold:Number($("#f_threshold").value||0),
  expiry_date:$("#f_expiry").value||null,note:$("#f_note").value.trim()||null,archived:$("#f_archived").checked};
  if(!b.name){toast("名称不能为空");return}
  try{if(state.editingId)await api(`/items/${state.editingId}`,{method:"PUT",body:JSON.stringify(b)});else await api("/items",{method:"POST",body:JSON.stringify(b)});
    $("#itemOverlay").classList.remove("show");await load();toast(state.editingId?"已更新":"已添加")}catch(e){toast("保存失败: "+e.message)}}

function renderCatList(){$("#cat_list").innerHTML=state.categories.map(c=>`<div class="card" style="animation:none"><div class="ic" style="width:38px;height:38px;font-size:18px">${cemo(c.name)}</div><div class="info" style="flex:1"><div class="nm">${esc(c.name)}</div></div><button class="trash" data-cdel="${c.id}" style="opacity:.8">🗑</button></div>`).join("")||`<div class="empty"><div class="e">🏷️</div><p>暂无分类</p></div>`;
  $$("#cat_list [data-cdel]").forEach(el=>el.onclick=async()=>{if(confirm("删除该分类? 分类下物品会变未分类")){try{await api(`/categories/${el.dataset.cdel}`,{method:"DELETE"});await load();renderCatList()}catch(e){toast(e.message)}}})}

$("#btnAdd").onclick=()=>openItem(null);
$("#btnInfo").onclick=()=>$("#infoOverlay").classList.add("show");
$("#btnExport").onclick=()=>window.open("/api/export","_blank");
$("#f_save").onclick=saveItem;
$("#cat_add").onclick=async()=>{const n=$("#cat_new").value.trim();if(!n)return;try{await api("/categories",{method:"POST",body:JSON.stringify({name:n})});$("#cat_new").value="";await load();renderCatList()}catch(e){toast(e.message)}};
$$(".overlay").forEach(o=>o.addEventListener("click",e=>{if(e.target===o)o.classList.remove("show")}));
$$("[data-close]").forEach(b=>b.onclick=()=>b.closest(".overlay").classList.remove("show"));
$$(".nbtn").forEach(b=>b.onclick=()=>{$$(".nbtn").forEach(x=>x.classList.toggle("on",x===b));
  if(b.dataset.nav==="cat"){renderCatList();$("#catOverlay").classList.add("show")}else{$("#catOverlay").classList.remove("show")}});
$("#q").addEventListener("input",e=>{state.q=e.target.value.trim();render()});
load();
</script>
</body>
</html>
